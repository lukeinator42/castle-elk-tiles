<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fall Elk Hotspots</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body, #map { height: 100%; margin: 0; background: #f4f3ef; }
  .legend { background: rgba(255,255,255,.92); padding: 8px 10px; font: 13px/1.5 system-ui, sans-serif; border-radius: 6px; color: #1f1f1d; }
  .legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 3px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([49.80, -114.40], 9);
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, attribution: '&copy; OpenStreetMap, SRTM | OpenTopoMap (CC-BY-SA)'}).addTo(map);
  const imagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18, attribution: 'Esri World Imagery'});
  const hotspots = L.tileLayer('{z}/{x}/{y}.png', {minZoom: 8, maxNativeZoom: 15, maxZoom: 18,
    attribution: 'Fall elk RSF after Paton (2012)'}).addTo(map);
  fetch('wmus.geojson').then(r => r.json()).then(g => {
    const wmu = L.geoJSON(g, {style: {color: '#1f1f1d', weight: 2, fill: false}}).addTo(map);
    layers.addOverlay(wmu, 'WMU boundaries');
  });
  const layers = L.control.layers({'Topo': topo, 'Imagery': imagery}, {'Hotspots': hotspots}).addTo(map);
  const legend = L.control({position: 'bottomright'});
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    d.innerHTML = '<b>Predicted fall use</b><br>' +
      '<i style="background:#3fa34d"></i>High (top 2 %)<br>' +
      '<i style="background:#f5e126"></i>Medium–High (top 5 %)<br>' +
      '<i style="background:#f59a23"></i>Low–Medium (top 10 %)';
    return d;
  };
  legend.addTo(map);
</script>
</body>
</html>
